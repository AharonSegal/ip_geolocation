apiVersion: apps/v1
kind: StatefulSet 
metadata: 
  name: redis
spec:
  selector:
    matchLabels:
      app: redis
  serviceName: "redis"
  replicas: 1
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis-con
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data # המיקום בו Redis שומר נתונים כברירת מחדל
  volumeClaimTemplates: # יוצר דיסק קבוע באופן אוטומטי
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi # הגדרת נפח האחסון הדרוש לך

