# Service name: server-a-service
#     - Name of the Service object itself.
#     - Used in commands like:
#         kubectl get service server-a-service
#     - Inside the cluster, other pods can reach this Service using:
#         http://server-a-service:8000
#
# Selector: app=server-a-label
#     - Tells the Service which Pods to send traffic to.
#     - Must match the Pod labels set by the Deployment:
#         template.metadata.labels.app: server-a-label
#     - Any Pod with label app=server-a-label will be a backend for this Service.
#
# Service type: NodePort
#     - Exposes the Service on each node's IP at a static port (nodePort).
#     - For production, you often use LoadBalancer or Ingress instead.
#
# Ports:
#   - port: 8000
#       * The port of the Service inside the cluster.
#       * Other services/pods call:
#           http://server-a-service:8000
#   - targetPort: 8000
#       * The port on the Pod (containerPort) that actually receives the traffic.
#       * Must match the container's exposed port in the Deployment:
#           containerPort: 8000
#   - nodePort: 30800
#       * The port exposed on the node's IP (Minikube VM or cluster node).
#       * From your machine you call:
#           http://<node-or-minikube-ip>:30800
#
apiVersion: v1
kind: Service
metadata:
  name: server-a-service
spec:
  type: NodePort        # for outside interaction
  selector:
    app: server-a-label
  ports:
    - port: 8000        # Service port inside cluster
      targetPort: 8000  # containerPort in server-a pods
      nodePort: 30800   # optional for NodePort (or let K8s choose if omitted)